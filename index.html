<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00102A" />
    <title>D0J EnGine</title>
    <style>
      html, body, #boot { margin: 0; height: 100%; background: #FFFFFF; }
      #boot { display: grid; place-items: center; color: #00102A; font: 300 18px system-ui, sans-serif; letter-spacing: .12em; }
      #boot.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="boot">D0J ENGINE</div>
    <div id="root"></div>
    <script>
      window.__d0jShowError = function (msg) {
        var b = document.getElementById('boot')
        if (b) { b.classList.remove('hidden'); b.textContent = 'D0J ENGINE: ' + msg }
      }
      window.addEventListener('error', function (e) { window.__d0jShowError(e.message || 'boot error') })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
